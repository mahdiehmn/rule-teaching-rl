# Vanilla PPO starting values, not a documented tuning result.
# This reference YAML is not wired into algos/ppo.py's CLI.
algo: ppo

learning_rate: 0.00025
num_envs: 8
num_steps: 128         # Rollout length per env before an update.
gamma: 0.99
gae_lambda: 0.95
num_minibatches: 4
update_epochs: 4
clip_coef: 0.2
ent_coef: 0.01
vf_coef: 0.5
